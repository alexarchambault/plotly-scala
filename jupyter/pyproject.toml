[project]
name = "plotly-scala-jupyter"
version = "0.0.0"
description = "Jupyter environment of the dev.jupyterCmd mill command"
requires-python = ">=3.10"
dependencies = [
  "jupyterlab>=4",
  # The JupyterLab renderer of plotly outputs (application/vnd.plotly.v1+json), shipped by plotly.
  # plotly 6 and later come with plotly.js 3, that ignores the string titles (and titlefont)
  # plotly-scala emits.
  "plotly>=5.24,<6",
]

[tool.uv]
package = false
