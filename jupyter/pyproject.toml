[project]
name = "plotly-scala-jupyter"
version = "0.0.0"
description = "Jupyter environment of the dev.jupyterCmd mill command"
requires-python = ">=3.10"
dependencies = [
  "jupyterlab>=4",
  # The JupyterLab renderer of plotly outputs (application/vnd.plotly.v1+json), shipped by plotly.
  # Its plotly.js should have the same major version as the one of plotly-scala, and be at least as
  # recent (checked by dev.checkPlotlyJs): plotly 7.1 comes with plotly.js 4.1.
  "plotly>=7.1,<8",
]

[tool.uv]
package = false
