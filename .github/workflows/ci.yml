name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        SCALA_VERSION: ["2.12.21", "2.13.18"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2 # selective execution on PRs needs the base commit
    - uses: coursier/cache-action@v8
    - run: scripts/ci-mill.sh "__[$SCALA_VERSION].{compile,test,mimaReportBinaryIssues}"
      env:
        SCALA_VERSION: ${{ matrix.SCALA_VERSION }}

  demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2 # selective execution on PRs needs the base commit
    - uses: coursier/cache-action@v8
    - run: scripts/ci-mill.sh demo.fullSite

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # the version is computed from git tags
    - uses: coursier/cache-action@v8
    - name: Release
      run: ./mill --no-daemon mill.javalib.SonatypeCentralPublishModule/
      env:
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
